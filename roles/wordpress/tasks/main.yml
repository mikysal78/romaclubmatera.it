---
- name: Installa WP-CLI
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
    dest: "{{ wordpress_cli_path }}"
    mode: "0755"
    force: false

- name: Scarica il core di WordPress
  ansible.builtin.command: >
    {{ wordpress_cli_path }} core download --locale={{ wp_locale }} --path={{ wp_root }}
  args:
    creates: "{{ wp_root }}/wp-load.php"
  become: true
  become_user: www-data

- name: Genera wp-config.php
  ansible.builtin.command: >
    {{ wordpress_cli_path }} config create
    --path={{ wp_root }}
    --dbname={{ db_name }}
    --dbuser={{ db_user }}
    --dbpass={{ db_password }}
    --dbhost={{ db_host }}
    --dbprefix={{ db_table_prefix }}
    --locale={{ wp_locale }}
    --skip-check
  args:
    creates: "{{ wp_root }}/wp-config.php"
  become: true
  become_user: www-data
  no_log: true

- name: Installa WordPress (crea admin e DB schema)
  ansible.builtin.command: >
    {{ wordpress_cli_path }} core install
    --path={{ wp_root }}
    --url={{ wordpress_url }}
    --title="{{ wp_site_title }}"
    --admin_user={{ wp_admin_user }}
    --admin_password={{ wp_admin_password }}
    --admin_email={{ wp_admin_email }}
    --skip-email
  register: wordpress_install
  changed_when: "'already installed' not in wordpress_install.stderr"
  failed_when:
    - wordpress_install.rc != 0
    - "'already installed' not in wordpress_install.stderr"
  become: true
  become_user: www-data
  no_log: true

# ---------- Hardening WordPress ----------
- name: Imposta le chiavi di sicurezza (salts)
  ansible.builtin.command: "{{ wordpress_cli_path }} config shuffle-salts --path={{ wp_root }}"
  become: true
  become_user: www-data
  changed_when: true

- name: Disabilita l'editor di file dalla dashboard
  ansible.builtin.command: "{{ wordpress_cli_path }} config set DISALLOW_FILE_EDIT true --raw --path={{ wp_root }}"
  become: true
  become_user: www-data
  changed_when: true

- name: Forza aggiornamenti automatici minor + sicurezza
  ansible.builtin.command: "{{ wordpress_cli_path }} config set WP_AUTO_UPDATE_CORE minor --path={{ wp_root }}"
  become: true
  become_user: www-data
  changed_when: true

# ---------- Redis object cache ----------
- name: Configura le costanti Redis in wp-config
  ansible.builtin.command: "{{ wordpress_cli_path }} config set {{ item.k }} {{ item.v }} {{ item.raw | default('') }} --path={{ wp_root }}"
  loop:
    - { k: "WP_REDIS_HOST", v: "127.0.0.1" }
    - { k: "WP_REDIS_PORT", v: "6379", raw: "--raw" }
    - { k: "WP_CACHE", v: "true", raw: "--raw" }
  become: true
  become_user: www-data
  changed_when: true
  when: enable_redis | bool

- name: Installa e attiva il plugin redis-cache
  ansible.builtin.command: "{{ wordpress_cli_path }} plugin install redis-cache --activate --path={{ wp_root }}"
  register: wordpress_redis_plugin
  changed_when: "'Plugin already installed' not in wordpress_redis_plugin.stdout"
  failed_when:
    - wordpress_redis_plugin.rc != 0
    - "'already installed' not in wordpress_redis_plugin.stdout"
  become: true
  become_user: www-data
  when: enable_redis | bool

- name: Abilita l'object cache Redis (drop-in)
  ansible.builtin.command: "{{ wordpress_cli_path }} redis enable --path={{ wp_root }}"
  register: wordpress_redis_enable
  changed_when: "'already enabled' not in wordpress_redis_enable.stdout"
  failed_when:
    - wordpress_redis_enable.rc != 0
    - "'already enabled' not in wordpress_redis_enable.stdout"
  become: true
  become_user: www-data
  when: enable_redis | bool

# ---------- Anti-spam (Cloudflare Turnstile) ----------
- name: Installa e attiva il plugin simple-cloudflare-turnstile
  ansible.builtin.command: "{{ wordpress_cli_path }} plugin install simple-cloudflare-turnstile --activate --path={{ wp_root }}"
  register: wordpress_turnstile_plugin
  changed_when: "'Plugin already installed' not in wordpress_turnstile_plugin.stdout"
  failed_when:
    - wordpress_turnstile_plugin.rc != 0
    - "'already installed' not in wordpress_turnstile_plugin.stdout"
  become: true
  become_user: www-data
  when: enable_turnstile | bool

- name: Abilita Turnstile su CF7, commenti, login e registrazione
  ansible.builtin.command: "{{ wordpress_cli_path }} option update {{ item }} 1 --path={{ wp_root }}"
  loop:
    - cfturnstile_cf7_all
    - cfturnstile_comment
    - cfturnstile_login
    - cfturnstile_register
  become: true
  become_user: www-data
  changed_when: true
  when: enable_turnstile | bool

# Modalità invisibile: il widget compare solo se serve un'interazione
# (dichiarato anche nella privacy policy del sito).
- name: Imposta Turnstile in modalità invisibile (interaction-only)
  ansible.builtin.command: "{{ wordpress_cli_path }} option update cfturnstile_appearance interaction-only --path={{ wp_root }}"
  become: true
  become_user: www-data
  changed_when: true
  when: enable_turnstile | bool

# Il plugin applica la protezione solo con cfturnstile_tested=yes: finché le
# chiavi non sono nel vault i form restano senza widget (nessun lockout).
- name: Configura le chiavi Turnstile (dal vault)
  ansible.builtin.command: "{{ wordpress_cli_path }} option update {{ item.k }} {{ item.v }} --path={{ wp_root }}"
  loop:
    - { k: "cfturnstile_key", v: "{{ turnstile_site_key }}" }
    - { k: "cfturnstile_secret", v: "{{ turnstile_secret_key }}" }
    - { k: "cfturnstile_tested", v: "yes" }
  become: true
  become_user: www-data
  changed_when: true
  no_log: true
  when:
    - enable_turnstile | bool
    - turnstile_site_key | length > 0
    - turnstile_secret_key | length > 0

# ---------- SEO (Yoast) ----------
- name: Installa e attiva il plugin Yoast SEO
  ansible.builtin.command: "{{ wordpress_cli_path }} plugin install wordpress-seo --activate --path={{ wp_root }}"
  register: wordpress_yoast_plugin
  changed_when: "'Plugin already installed' not in wordpress_yoast_plugin.stdout"
  failed_when:
    - wordpress_yoast_plugin.rc != 0
    - "'already installed' not in wordpress_yoast_plugin.stdout"
  become: true
  become_user: www-data

# URL parlanti (/%postname%/): requisito SEO, gli URL ?p=N vengono rediretti in 301
- name: Permalink structure /%postname%/
  ansible.builtin.command: "{{ wordpress_cli_path }} option update permalink_structure '/%postname%/' --path={{ wp_root }}"
  become: true
  become_user: www-data
  changed_when: true

# ---------- Email in uscita (WP Mail SMTP) ----------
- name: Installa e attiva il plugin WP Mail SMTP
  ansible.builtin.command: "{{ wordpress_cli_path }} plugin install wp-mail-smtp --activate --path={{ wp_root }}"
  register: wordpress_smtp_plugin
  changed_when: "'Plugin already installed' not in wordpress_smtp_plugin.stdout"
  failed_when:
    - wordpress_smtp_plugin.rc != 0
    - "'already installed' not in wordpress_smtp_plugin.stdout"
  become: true
  become_user: www-data
  when: enable_smtp | bool

- name: Configura WP Mail SMTP in wp-config.php
  ansible.builtin.command: >-
    {{ wordpress_cli_path }} config set {{ item.k }} "{{ item.v }}"
    {{ item.raw | default('') }} --path={{ wp_root }}
  loop:
    - { k: "WPMS_ON", v: "true", raw: "--raw" }
    - { k: "WPMS_MAILER", v: "smtp" }
    - { k: "WPMS_SMTP_HOST", v: "{{ smtp_host }}" }
    - { k: "WPMS_SMTP_PORT", v: "{{ smtp_port }}", raw: "--raw" }
    - { k: "WPMS_SSL", v: "tls" }
    - { k: "WPMS_SMTP_AUTH", v: "true", raw: "--raw" }
    - { k: "WPMS_SMTP_USER", v: "{{ smtp_user }}" }
    - { k: "WPMS_MAIL_FROM", v: "{{ smtp_from }}" }
    - { k: "WPMS_MAIL_FROM_FORCE", v: "true", raw: "--raw" }
    - { k: "WPMS_MAIL_FROM_NAME", v: "{{ smtp_from_name }}" }
    - { k: "WPMS_MAIL_FROM_NAME_FORCE", v: "true", raw: "--raw" }
  become: true
  become_user: www-data
  changed_when: true
  when: enable_smtp | bool

- name: Configura la password SMTP (dal vault)
  ansible.builtin.command: >-
    {{ wordpress_cli_path }} config set WPMS_SMTP_PASS "{{ smtp_password }}"
    --path={{ wp_root }}
  become: true
  become_user: www-data
  changed_when: true
  no_log: true
  when:
    - enable_smtp | bool
    - smtp_password | length > 0

# ---------- Commenti disattivati ----------
- name: Disattiva commenti e ping sui nuovi contenuti
  ansible.builtin.command: "{{ wordpress_cli_path }} option update {{ item }} closed --path={{ wp_root }}"
  loop:
    - default_comment_status
    - default_ping_status
  become: true
  become_user: www-data
  changed_when: true

# ---------- Mu-plugin ----------
- name: Directory mu-plugins
  ansible.builtin.file:
    path: "{{ wp_root }}/wp-content/mu-plugins"
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"

# Formato 16:9 (800x450) usato dalla gallery "Le trasferte dei tifosi"
- name: Installa il mu-plugin con le dimensioni immagine personalizzate
  ansible.builtin.copy:
    src: rcm-image-sizes.php
    dest: "{{ wp_root }}/wp-content/mu-plugins/rcm-image-sizes.php"
    owner: www-data
    group: www-data
    mode: "0644"

# Anagrafica soci (import CSV) e auguri di compleanno automatici
- name: Installa il mu-plugin dei compleanni
  ansible.builtin.copy:
    src: rcm-compleanni.php
    dest: "{{ wp_root }}/wp-content/mu-plugins/rcm-compleanni.php"
    owner: www-data
    group: www-data
    mode: "0644"

# Rimando alla prima pagina de Il Romanista in fondo alla colonna destra del
# footer. E' un link, non la locandina: la riproduzione richiede l'ok della
# redazione (il perche' e' spiegato in testa al file).
- name: Installa il mu-plugin del rimando a Il Romanista
  ansible.builtin.copy:
    src: rcm-romanista.php
    dest: "{{ wp_root }}/wp-content/mu-plugins/rcm-romanista.php"
    owner: www-data
    group: www-data
    mode: "0644"

# Recensioni dei soci: tipo di contenuto, modulo pubblico con Turnstile e
# moderazione, striscia scorrevole sopra il footer. Il CSS sta accanto al
# mu-plugin perche' e' parte della stessa funzione, non del tema.
- name: Installa il mu-plugin delle recensioni
  ansible.builtin.copy:
    src: rcm-recensioni.php
    dest: "{{ wp_root }}/wp-content/mu-plugins/rcm-recensioni.php"
    owner: www-data
    group: www-data
    mode: "0644"

- name: Installa gli asset delle recensioni
  ansible.builtin.copy:
    src: rcm-recensioni/
    dest: "{{ wp_root }}/wp-content/mu-plugins/rcm-recensioni/"
    owner: www-data
    group: www-data
    mode: "0644"
    directory_mode: "0755"

# Frase in romanesco nell'hero della pagina Sponsor: l'hero e' un template del
# tema, quindi il testo va agganciato all'action thewebs_entry_hero
- name: Installa il mu-plugin del claim nell'hero della pagina Sponsor
  ansible.builtin.copy:
    src: rcm-sponsor-hero.php
    dest: "{{ wp_root }}/wp-content/mu-plugins/rcm-sponsor-hero.php"
    owner: www-data
    group: www-data
    mode: "0644"

# Il CSS su misura del sito stava in "Aspetto > Personalizza > CSS aggiuntivo",
# cioe' dentro il database: un ripristino da zero se lo perdeva. Ora e' un file
# del tema figlio, versionato qui. Il tema figlio pero' arriva con
# import-site.yml, quindi alla primissima installazione questi task si saltano:
# basta rilanciare site.yml dopo l'import.
- name: Verifica se il tema figlio e' gia' installato
  ansible.builtin.stat:
    path: "{{ wp_child_theme_dir }}/functions.php"
  register: rcm_child_theme

- name: Directory del CSS su misura nel tema figlio
  ansible.builtin.file:
    path: "{{ wp_child_theme_dir }}/assets/css"
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"
  when: rcm_child_theme.stat.exists

- name: Installa il CSS su misura del sito
  ansible.builtin.copy:
    src: rcm-custom.css
    dest: "{{ wp_child_theme_dir }}/assets/css/rcm-custom.css"
    owner: www-data
    group: www-data
    mode: "0644"
  when: rcm_child_theme.stat.exists

# Non un wp_enqueue_style normale: il foglio va stampato su wp_head 101, dove
# stava il CSS del Customizer, altrimenti esce prima di Elementor e le regole
# con pari specificita' perdono. Il perche' e' spiegato nello snippet stesso.
- name: Aggancia il CSS su misura nel functions.php del tema figlio
  ansible.builtin.blockinfile:
    path: "{{ wp_child_theme_dir }}/functions.php"
    marker: "// {mark} RCM CUSTOM CSS"
    block: "{{ lookup('ansible.builtin.file', 'rcm-enqueue-custom-css.php') }}"
    owner: www-data
    group: www-data
    mode: "0644"
  when: rcm_child_theme.stat.exists

# WP-Cron parte solo con le visite: su un sito a basso traffico gli auguri
# uscirebbero in ritardo. Con questo cron di sistema gli eventi scaduti girano comunque.
- name: Cron di sistema per gli eventi WP-Cron scaduti
  ansible.builtin.cron:
    name: wp-cron romaclubmatera
    minute: "*/15"
    user: www-data
    job: "{{ wordpress_cli_path }} cron event run --due-now --path={{ wp_root }} >/dev/null 2>&1"

# ---------- Permessi ----------
- name: Proprietario corretto su tutti i file
  ansible.builtin.file:
    path: "{{ wp_root }}"
    owner: www-data
    group: www-data
    recurse: true

- name: Permessi sicuri sulle directory (755)
  ansible.builtin.command: find {{ wp_root }} -type d -exec chmod 755 {} +
  changed_when: false

- name: Permessi sicuri sui file (644)
  ansible.builtin.command: find {{ wp_root }} -type f -exec chmod 644 {} +
  changed_when: false

- name: Permessi ristretti su wp-config.php (640)
  ansible.builtin.file:
    path: "{{ wp_root }}/wp-config.php"
    mode: "0640"
    owner: www-data
    group: www-data
