---
- name: Installa Nginx
  ansible.builtin.apt:
    name: "{{ webserver_nginx_packages }}"
    state: present

- name: Crea la document root del sito
  ansible.builtin.file:
    path: "{{ wp_root }}"
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"

- name: Crea le directory per la FastCGI cache
  ansible.builtin.file:
    path: /var/cache/nginx/fastcgi
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"
  when: enable_fastcgi_cache | bool

- name: Snippet globale FastCGI cache
  ansible.builtin.template:
    src: fastcgi_cache.conf.j2
    dest: /etc/nginx/conf.d/fastcgi_cache.conf
    mode: "0644"
  when: enable_fastcgi_cache | bool
  notify: Reload nginx

- name: Rimuovi il default vhost
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/nginx/sites-enabled/default
    - /etc/nginx/sites-available/default
  notify: Reload nginx

# Il certificato lo deposita ansible-dns, non questo progetto: prima di
# scrivere il vhost si guarda se c'e'. Se manca si serve il solo HTTP, che e'
# spiacevole ma funziona; un ssl_certificate che punta al vuoto invece
# impedisce a nginx di partire, e il sito sparisce del tutto.
- name: Verifica se il certificato TLS e' gia' sul CT
  ansible.builtin.stat:
    path: "{{ webserver_tls_cert }}"
  register: webserver_cert
  when: webserver_tls | bool

- name: Avviso - certificato TLS assente, il vhost restera' in HTTP
  ansible.builtin.debug:
    msg: >-
      {{ webserver_tls_cert }} non c'e': il vhost viene scritto senza HTTPS.
      Il certificato lo deposita il playbook ansible-dns; una volta li',
      basta rilanciare questo ruolo.
  when:
    - webserver_tls | bool
    - not (webserver_cert.stat.exists | default(false))

- name: Configura il vhost WordPress
  ansible.builtin.template:
    src: wordpress.conf.j2
    dest: "/etc/nginx/sites-available/{{ wp_domain }}.conf"
    mode: "0644"
  vars:
    webserver_tls_presente: "{{ webserver_cert.stat.exists | default(false) }}"
  notify: Reload nginx

- name: Abilita il vhost WordPress
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ wp_domain }}.conf"
    dest: "/etc/nginx/sites-enabled/{{ wp_domain }}.conf"
    state: link
  notify: Reload nginx

- name: Hardening globale Nginx (security headers)
  ansible.builtin.copy:
    dest: /etc/nginx/conf.d/security.conf
    mode: "0644"
    content: |
      # server_tokens e' impostato nel vhost (Debian Trixie lo definisce gia' in nginx.conf)
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  notify: Reload nginx

- name: Verifica la configurazione Nginx
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Abilita e avvia Nginx
  ansible.builtin.service:
    name: nginx
    enabled: true
    state: started

# ---------- Emissione con certbot (spenta) ----------
# Su questo sito il certificato arriva da ansible-dns, per validazione DNS, e
# il vhost qui sopra lo serve gia' da se'. Certbot resta disponibile per host
# che non passano da li' - si accende con webserver_certbot -, ma va acceso
# sapendo che riscrive il vhost per conto suo e che allora due strumenti
# scrivono lo stesso file.
# enable_https continua a significare "questo sito parla HTTPS"; a emetterlo
# ci pensa qualcun altro.
- name: Emetti il certificato con certbot
  ansible.builtin.include_role:
    name: letsencrypt
  when:
    - enable_https | bool
    - webserver_certbot | default(false) | bool
