---
webserver_nginx_packages:
  - nginx
webserver_client_max_body_size: "{{ php_upload_max_filesize }}"

# ---------------------------------------------------------------------------
#  HTTPS
# ---------------------------------------------------------------------------
# Il certificato NON lo emette questo progetto: arriva gia' pronto sul CT,
# depositato dal playbook ansible-dns, che lo ottiene per validazione DNS.
# Qui lo si serve e basta.
#
# Il blocco 443 sta nel template del vhost, non aggiunto dopo da certbot. La
# differenza non e' di stile: finche' l'HTTPS lo iniettava certbot, ogni
# riscrittura del vhost lasciava il sito con la sola porta 80, che rimanda
# alla 443 - cioe' irraggiungibile finche' qualcuno non rimetteva il blocco.
# E' successo davvero, per tre minuti. Con il template autosufficiente quella
# finestra non esiste.
webserver_tls: true
webserver_tls_cert: "/etc/ssl/acme/{{ wp_domain }}.fullchain.pem"
webserver_tls_key: "/etc/ssl/acme/{{ wp_domain }}.key"

# Emissione del certificato con certbot dal ruolo 'letsencrypt'. Spenta: se ne
# occupa ansible-dns. Riaccenderla solo su host che non passano di li', e
# sapendo che certbot riscrive il vhost per conto suo.
webserver_certbot: false

# Indirizzi vecchi che i motori di ricerca tengono ancora in classifica ma che
# oggi risponderebbero 404, oppure doppioni da consolidare. Un 301 vale un
# 404 piu' i visitatori che ci arrivano: /one-team-one-goal/ e' un contenuto
# demo del tema, cancellato da tempo, e in due mesi ha portato nove clic
# atterrati su "Pagina non trovata".
# Le pagine /calendar/... sono i calendari SportsPress: il contenuto vero sta
# su /calendario/, che li mostra entrambi.
webserver_redirect_permanenti:
  - da: "/one-team-one-goal/"
    a: "/"
  - da: "/score-the-winning-goal/"
    a: "/"
  - da: "/roma-juventus-2013/"
    a: "/news/"
  - da: "/calendar/calendario-as-roma-2026-27/"
    a: "/calendario/"
  - da: "/calendar/calendario-champions-league-2026-27/"
    a: "/calendario/"
  - da: "/calendar/calendario/"
    a: "/calendario/"
